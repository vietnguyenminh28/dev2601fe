                const regxEmail = /^[a-zA-Z0-9.]{6,10}@gmail\.com$/;
        const regxPass = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[^a-zA-Z0-9]).{8,}$/;

        const inputEmail = document.getElementById("email");
        const inputPass = document.getElementById("password");
        const btnHienThi = document.getElementById("btn-hien-thi");

        // 1. Sửa lỗi logic ẩn/hiện mật khẩu (dùng toán tử 3 ngôi)
        btnHienThi.onclick = () => {
            inputPass.type = inputPass.type === "password" ? "text" : "password";
        };

        // 2. Gộp chung logic kiểm tra tính hợp lệ (tránh lặp code)
        const validateInput = (element, regex) => {
            // Nếu test đúng -> "none" (ẩn lỗi), nếu sai -> "block" (hiện lỗi)
            element.nextElementSibling.style.display = regex.test(element.value) ? "none" : "block";
        };

        // 3. Gắn sự kiện onblur
        inputEmail.onblur = () => validateInput(inputEmail, regxEmail);
        inputPass.onblur = () => validateInput(inputPass, regxPass);    
    </script>
