<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab07-B5</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1{
            text-align: center;
        }
        section{
            width: 500px;
            margin: 1rem auto;
            padding: 1rem;
            border: 1px solid green;
            border-radius: 10px;
            text-align: center;
        }
        button{
            background-color: green;
            color: #fff;
            padding: 1rem 2rem;
            margin: 1rem auto;
            border: none;
            border-radius: 999px;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <section>
        <h1>AddEventListener</h1>
        <button id="btn1">Click me</button>
        <span></span>
    </section>
    <script>
        dem = 0;
        document.getElementById("btn1").addEventListener("click", function(){
            dem++;
            document.querySelector("span").innerHTML = "Bạn đã click " + dem + " lần";
        });
    </script>
</body>
</html>
