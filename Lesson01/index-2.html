<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>các thẻ cơ bản - a,img</title>
</head>
<body>
    <h1>Các thẻ cơ bản - a,img</h1>
    <hr/>
    <h2>Thẻ a - anchor(liên kết)</h2>
    <p>Liên kết đến một trang web:
    <a href="https://www.google.com" target="_blank"
    rel="noopener noreferrer"> Google</a>
    <hr/>
    <h2>Thẻ img - hình ảnh</h2>
    <p>
        <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Trulli" width="500" height="333">
    </p>
    <p>
        Hình ảnh từ thư mục hiện tại:
        <br/>
        <img src="images/html5.jpg" alt="Your Image" width="500" height="333">
    </p>
</body>
</html>
