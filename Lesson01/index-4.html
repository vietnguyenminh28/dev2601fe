<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thẻ thể hiện danh sách có thứ tự ol,li</title>
</head>
<body>
    <h1>Thẻ thể hiện danh sách có thứ tự ol,li</h1>
    <hr/>
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ol>
    <ol type="A">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ol>
    <ol type="i">   
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>     
    </ol> 
    <h2> Thẻ ol lồng nhau </h2>
    <ol>
        <li>Item 1</li>
            <ol type="i">
                <li>Item 1.1</li>
                <li>Item 1.2</li>
                <li>Item 1.3</li>
            </ol>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
</body>
</html>
