<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lab03-ex7</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        nav {
            background-color: #111;
            padding: 15px 0;
        }
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        a {
            text-decoration: none;
            color: #fff;
            padding: 10px 25px;
            display: block;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        a:hover {
            background-color: #ffcc00;
            color: #111;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Khóa học</a></li>
            <li><a href="#">Bài viết</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </nav>
</body>
</html>
