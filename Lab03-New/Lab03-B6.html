<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Layout blog chuẩn</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #111;
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
            z-index: 1000;
        }
        header .logo {
            font-weight: bold;
            font-size: 18px;
        }
        header nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
        }
        .container {
            display: flex;
            margin: 70px auto 0;
            max-width: 1000px;
            padding: 20px;
        }
        .sidebar {
            width: 200px;
            position: sticky;
            top: 80px;
            height: fit-content;
            padding-right: 20px;
        }
        .sidebar h3 {
            margin-top: 0;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin-bottom: 15px;
            color: #555;
        }
        .content {
            flex: 1;
            padding-left: 30px;
            border-left: 2px solid #eee;
        }
        .content h1 {
            margin-top: 0;
        }
        .content p {
            line-height: 1.6;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">MyBlog</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Posts</a>
            <a href="#">About</a>
        </nav>
    </header>
    
    <div class="container">
        <aside class="sidebar">
            <h3>Danh mục</h3>
            <ul>
                <li>HTML/CSS</li>
                <li>JavaScript</li>
                <li>React</li>
                <li>Node.js</li>
            </ul>
        </aside>
        
        <main class="content">
            <h1>Tiêu đề bài viết</h1>
            <p>Cuộn xuống để kiểm tra header fixed, sidebar sticky và content scroll.</p>
            <p>Đoạn 1...<br><br><br><br><br><br></p>
            <p>Đoạn 2...<br><br><br><br><br><br></p>
            <p>Đoạn 3...<br><br><br><br><br><br></p>
            <p>Đoạn 4...<br><br><br><br><br><br></p>
        </main>
    </div>
</body>
</html>
