<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lab03-ex8</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }
        .card {
            background: #ffffff;
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .card img {
            width: 100%;
            max-width: 220px;
            margin-bottom: 20px;
        }
        .card h3 {
            font-size: 16px;
            color: #111;
            text-align: center;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }
        .card .price {
            font-size: 20px;
            font-weight: bold;
            color: #e34c4c;
            margin: 0 0 20px 0;
        }
        .card button {
            background: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .card button:hover {
            background: #333333;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="../images/laptop.jpg" alt="Dell Alienware 16 Aurora (2025)">
        <h3>Dell Alienware 16 Aurora<br>(2025)</h3>
        <p class="price">39.690.000đ</p>
        <button>Mua ngay</button>
    </div>
</body>
</html>
