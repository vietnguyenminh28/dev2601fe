<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lab03-ex4</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            padding: 50px;
        }
        .banner {
            width: 500px;
            height: 300px;
            background-image: url('../images/baibien.jpg'); 
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.3);
        }
        .banner h2 {
            font-size: 24px;
            margin: 0 0 10px 0;
        }
        .banner p {
            font-size: 16px;
            margin: 0 0 20px 0;
        }
        .banner a {
            display: inline-block;
            padding: 8px 20px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            background-color: transparent;
            transition: 0.3s;
        }
        .banner a:hover {
            background-color: #ffffff;
            color: #333333;
        }
    </style>
</head>
<body>

    <div class="banner">
        <h2>Du lịch Đà Nẵng</h2>
        <p>Biển xanh – nắng vàng – trải nghiệm tuyệt vời</p>
        <a href="#">Xem thêm</a>
    </div>

</body>
</html>
