<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selector cơ bản</title>
    <style>
        p{
            background-color:#f0f0f0;
        }
#test{
            background-color: red;}
    </style>
    <link rel="stylesheet" href="assets/layout.css">
</head>
<body>
    <p>This is a paragraph.</p>
    <p id="test">This is another paragraph.</p>
<h4 class="test">This is a heading.</h4>
<p>
    <lorem> Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</lorem>
</p>
</body>
</html>


<!--Theo ID, theo class , theo tên thuộc tính + giá trị thuộc tính và theo class(CSS selector)-->
