<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành tổng hợp</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        /* Bố cục chính */
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .left-panel {
            flex: 2;
            min-width: 600px;
        }

        .right-panel {
            flex: 1;
            min-width: 300px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #dee2e6;
            padding: 12px 8px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #f8f9fa;
        }

        .btn {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .btn-xem{
            background-color: green;
        }
        .btn-sua{
            background-color: blue;
        }
        .btn-xoa{
            background-color: red;
        }
        .btn:hover {
            opacity: 0.8;
        }

        .btn-add {
            background-color: #1c3690; /* Xanh đậm */
        }

        .btn-view {
            background-color: #f75d5d; /* Đỏ nhạt */
        }

        .btn-edit {
            background-color: #ffb703; /* Vàng cam */
            color: #000;
        }

        .btn-delete {
            background-color: #20c997; /* Xanh ngọc */
        }

        /* Toolbar (Thanh công cụ trên cùng) */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-sort {
            display: flex;
            gap: 10px;
        }

        .search-sort input, 
        .search-sort select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        /* Form thông tin */
        .form-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .form-group label {
            width: 120px;
            font-weight: bold;
            font-size: 13px;
            color: #555;
        }

        .form-group input, 
        .form-group select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            border-color: #80bdff;
        }

        h3 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Quản lý thông tin sinh viên</h1>
    </header>   
    <section>
             <div class="container">
        <div class="card left-panel">
            <div class="toolbar">
                <button class="btn btn-add" onclick="openForm('add')">Thêm mới sinh viên</button>
                <div>
                    <input type="text" id="searchInput" placeholder="Search Here">
                    <button class="btn btn-add" onclick="searchStudent()">Tìm kiếm</button>
                    <select id="sortSelect" onchange="sortStudent()">
                        <option value="">Sắp xếp</option>
                        <option value="nameASC">Tên tăng dần</option>
                        <option value="nameDESC">Tên giảm dần</option>
                    </select>
                </div>
            </div>
            <h3>Danh Sách Sinh Viên</h3>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã sinh viên</th>
                        <th>Tên sinh viên</th>
                        <th>Tuổi</th>
                        <th>Giới tính</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
               <tbody>
                <tr>
                    <td>1</td>
                    <td>SV001</td>
                    <td>Nguyễn Văn A</td>
                    <td>20</td>
                    <td>Nam</td>
                    <td>
                        <button class="btn btn-xem">Xem</button>
                        <button class="btn btn-sua">Sửa</button>
                        <button class="btn btn-xoa">Xóa</button>
                    </td>
                </tr>
               </tbody>
        
    </section>
    <script>
        const fn_renderStudents = (data)=>{
            $(".list table tbody").empty;

            data.forEach((student,index) => {
                let gioiTinh = student.sex ? "Nam":"Nữ";
                
                let row =  `
                    <tr>
                    <td>${index+1}</td>
                    <td>${student.studentId}</td>
                    <td>${student.studentId}</td>
                    <td>${student.age}</td>
                    <td>${gioiTinh}</td>
                    <td>
                        <button class="btn btn-xem">Xem</button>
                        <button class="btn btn-sua">Sửa</button>
                        <button class="btn btn-xoa">Xóa</button>
                    </td>
                </tr>
            `;
            $(".list table tbody").append(row);
            });
        }
        $(document).ready(()=>{
            $('btn-add').click(()=>{
                $('.box-right').fadeOut(1000).fadeIn(1000);
            }); 
        })
    </script>
    <script src="js.js"></script>
</body>
</html>
