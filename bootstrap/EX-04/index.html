<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thực hành - Form Inline Bootstrap 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-border {
            border: 1px solid red;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 col-lg-10">
                <div class="custom-border">
                    <h5>login member</h5>
                    <form class="d-flex flex-wrap align-items-center gap-3">
                        <div class="d-flex align-items-center gap-2">
                            <label for="email" class="text-nowrap">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Please input your email">
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <label for="password" class="text-nowrap">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Please input your password">
                        </div>
                        <div class="form-check mb-0">
                            <input type="checkbox" class="form-check-input" name="remember" id="remember">
                            <label class="form-check-label text-nowrap" for="remember">Remember me</label>
                        </div>
                        <button type="submit" class="btn btn-light border">Sign in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
