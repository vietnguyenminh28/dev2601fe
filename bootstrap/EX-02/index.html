<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thực hành số 03 - Hệ thống lưới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-col {
            background-color: #d9d9d9;
            border: 1px solid red;
            padding: 15px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12 col-sm-6 col-md-8 custom-col">.col-12 .col-sm-6 .col-md-8</div>
            <div class="col-12 col-sm-6 col-md-4 custom-col">.col-12 .col-sm-6 .col-md-4</div>
        </div>

        <div class="row">
            <div class="col-12 col-sm-6 col-md-4 custom-col">.col-12 .col-sm-6 .col-md-4</div>
            <div class="col-12 col-sm-6 col-md-4 custom-col">.col-12 .col-sm-6 .col-md-4</div>
            <div class="col-12 col-sm-6 col-md-4 custom-col">.col-12 .col-sm-6 .col-md-4</div>
        </div>

        <div class="row">
            <div class="col-12 col-sm-6 col-md-6 custom-col">.col-12 .col-sm-6 .col-md-6</div>
            <div class="col-12 col-sm-6 col-md-6 custom-col">.col-12 .col-sm-6 .col-md-6</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
