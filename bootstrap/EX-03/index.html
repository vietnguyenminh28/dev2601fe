<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thực hành 03 - Table Bootstrap</title>
    <!-- Nhúng CSS Bootstrap 5 qua CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <!-- Thêm thẻ div table-responsive để xuất hiện thanh trượt ngang trên mobile -->
            <div class="table-responsive">
                <!-- Gộp các class table, table-striped, table-bordered, table-hover -->
                <table class="table table-striped table-bordered table-hover">
                    <tr>
                        <th>#</th>
                        <th>Họ Tên</th>
                        <th>Tuổi</th>
                        <th>Giới tính</th>
                        <th>Quê Quán</th>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td>Nguyễn Văn A</td>
                        <td>18</td>
                        <td>Nam</td>
                        <td>Hải Dương</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Hoàng Quốc Ti</td>
                        <td>22</td>
                        <td>Nữ</td>
                        <td>Vĩnh Phúc</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>PHạm Xuân H</td>
                        <td>19</td>
                        <td>Nam</td>
                        <td>Hà Nam</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Đỗ Quốc V</td>
                        <td>23</td>
                        <td>Nam</td>
                        <td>Hưng Yên</td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>Đỗ Bùi Như Lạc</td>
                        <td>25</td>
                        <td>Nữ</td>
                        <td>Ninh Bình</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <!-- Nhúng JS Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
