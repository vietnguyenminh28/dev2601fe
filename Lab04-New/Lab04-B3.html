<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab04-EX3</title>
    <style>
        body{
            margin: 0;
            padding-top: 100px;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .container{
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .main-title{
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .main-title::after{
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            background-color: #2ea043;
            margin: 10px auto 0 auto;
        }
        .card-wrapper{
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .card{
            position: relative;
            width: 320px;
            margin: 20px;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            color: white;
            cursor: pointer;
        }
        .card-img{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .overlay{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(20, 30, 48, 0.6);
            z-index: -1;
            transition: background-color 0.3s ease;
        }
        .card:hover .overlay{
            background-color: rgba(46, 160, 67, 0.85);
        }
        .content{
            padding: 40px 20px;
        }
        .icon-box{
            width: 55px;
            height: 55px;
            background-color: white;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            line-height: 55px; 
            font-size: 24px;
        }
        .service-label{
            font-size: 12px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
        }
        .service-title{
            font-size: 16px;
            margin: 0 0 20px 0;
        }
        .btn-detail{
            padding: 8px 25px;
            border: 1px solid white;
            border-radius: 20px;
            background: transparent;
            color: white;
            cursor: pointer;
        }
        .btn-detail:hover{
            background-color: white;
            color: #2ea043;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="main-title">Dịch vụ</h2>
        <div class="card-wrapper">
            <div class="card">
                <img src="../images/b31.avif" alt="Vận tải" class="card-img">
                <div class="overlay"></div>
                <div class="content">
                    <div class="icon-box">🚚</div>
                    <p class="service-label">Dịch vụ</p>
                    <h3 class="service-title">Vận tải</h3>
                    <button class="btn-detail">Chi tiết</button>
            </div>  
    </div>
    <div class="card">
                <img src="../images/b32.avif" alt="Xuất khẩu lao động" class="card-img">
                <div class="overlay"></div>
                <div class="content">
                    <div class="icon-box">💬</div>
                    <p class="service-label">Dịch vụ</p>
                    <h3 class="service-title">Ủy thác xuất nhập khẩu</h3>
                    <button class="btn-detail">Chi tiết</button>
            </div>
    </div>
    <div class="card">
                <img src="../images/b3.avif" alt="Tư vấn xuất khẩu lao động" class="card-img">
                <div class="overlay"></div>
                <div class="content">
                    <div class="icon-box">💬</div>
                    <p class="service-label">Dịch vụ</p>
                    <h3 class="service-title">Tư vấn xuất khẩu lao động</h3>
                    <button class="btn-detail">Chi tiết</button>
            </div>
    </div>
    </div>
    </div>
</body>
</html>
