<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab04-ex4</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff;
        }

        .news-container {
            width: 360px;
            background-color: #f2f2f2;
            padding: 25px;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 22px;
            color: #333;
            margin: 0 0 20px 0;
            position: relative;
            padding-bottom: 10px;
        }

        .section-title::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 45px;
            height: 3px;
            background-color: #4caf50;
        }

        .news-image {
            width: 100%;
            background-color: white;
            padding: 8px;
            box-sizing: border-box;
        }

        .news-image img {
            width: 100%;
            display: block;
            object-fit: cover;
            height: 180px;
        }

        .news-title {
            font-size: 17px;
            color: #2c3e50;
            margin: 20px 0 12px 0;
            line-height: 1.4;
        }

        .news-meta {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 15px;
        }

        .news-meta svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #4caf50;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-right: 6px;
        }

        .news-desc {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="news-container">
        <h2 class="section-title">TIN TỨC</h2>
        
        <div class="news-image">
            <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Chế phẩm hóa học" title="Chế phẩm hóa học là gì? Và">
        </div>

        <h3 class="news-title">Chế phẩm hóa học là gì? Và những điều cần lưu ý khi sử dụng</h3>
        
        <div class="news-meta">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            06/06/2019
        </div>
        
        <p class="news-desc">NaOH hay còn được gọi dưới cái tên Sodium hydroxide, tên gọi trong hóa học là Natri Hydroxit. Các dạng cấu trúc: xút vảy, xút hạt, xút lỏng....</p>
    </div>
</body>
</html>
