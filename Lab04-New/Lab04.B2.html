<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab04-ex2</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .card {
            position: relative;
            width: 360px;
            height: 240px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            background-image: url('https://images.unsplash.com/photo-1556761175-4b46a572b786?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            cursor: pointer;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(20, 30, 48, 0.6);
            transition: background-color 0.4s ease;
        }

        .card:hover .overlay {
            background-color: rgba(46, 160, 67, 0.85);
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
            color: white;
            box-sizing: border-box;
        }

        .icon-box {
            width: 55px;
            height: 55px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .icon-box svg {
            width: 30px;
            height: 30px;
            fill: #2ea043;
        }

        .service-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 6px 0;
        }

        .service-title {
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 0 0 16px 0;
        }

        .btn-detail {
            padding: 6px 24px;
            border: 1px solid white;
            border-radius: 20px;
            background: transparent;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover .btn-detail:hover {
            background-color: white;
            color: #2ea043;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="overlay"></div>
        <div class="content">
            <div class="icon-box">
                <svg viewBox="0 0 24 24">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                    <path d="M7 9h10v2H7zm0-3h10v2H7z"/>
                </svg>
            </div>
            <p class="service-label">Dịch vụ</p>
            <h3 class="service-title">Tư vấn xuất khẩu lao động</h3>
            <button class="btn-detail">Chi tiết</button>
        </div>
    </div>
</body>
</html>
