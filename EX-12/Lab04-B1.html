<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 1</title>
    <style>
        .container-bt1 {
            background-color: #e6e6fa; 
            width: 300px;
            padding: 20px 40px;
            font-family: 'Times New Roman', serif;
            font-size: 18px;
        }

        .container-bt1 ul li {
            color: blue;
        }

        .container-bt1 ol li {
            color: red;
        }
    </style>
</head>
<body>

    <div class="container-bt1">
        <ul>
            <li>China</li>
            <li>India</li>
        </ul>
        
        <ol>
            <li>United States</li>
            <li>United Kingdom</li>
        </ol>
    </div>

</body>
</html>
