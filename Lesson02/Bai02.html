<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 2: Bảng Tên Miền</title>
</head>
<body>
    <table border="1" style="border-collapse: collapse; text-align: center; width: 600px;">
        
        <!-- Phần Đầu Bảng (Định dạng nền đen, chữ vàng) -->
        <thead>
            <tr style="background-color: black; color: yellow;">
                <th style="padding: 10px;">Tên miền</th>
                <th style="padding: 10px;">Phí cài đặt</th>
                <th style="padding: 10px;">Chi phí</th>
            </tr>
        </thead>
        
        <!-- Phần Thân Bảng -->
        <tbody>
            <tr>
                <td style="padding: 8px;">.com</td>
                <td>Miễn phí</td>
                <td>200.000đ/năm</td>
            </tr>
            <tr>
                <td style="padding: 8px;">.net</td>
                <td>Miễn phí</td>
                <td>200.000đ/năm</td>
            </tr>
            <tr>
                <td style="padding: 8px;">.co.uk</td>
                <td>Miễn phí</td>
                <td>Miễn phí</td>
            </tr>
        </tbody>
        
    </table>

</body>
</html>
