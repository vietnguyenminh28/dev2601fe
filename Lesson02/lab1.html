<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>Đăng ký Nhân Viên</h1>
        <form action="/dang-ky-thanh-cong" method="POST" enctype="multipart/form-data">
            <fieldset>
                <legend>Thông tin cá nhân</legend>
                <div class="form-group">
                    <label for="fullname">Họ và Tên <span style="color:red;">*</span></label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nhập đầy đủ họ tên..." required autofocus>
                </div>

            <div class="form-group">
                <label for="email">Địa chỉ Email <span style="color:red;">*</span></label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="pwd">Mật khẩu bảo mật <span style="color:red;">*</span></label>
                <input type="password" id="pwd" name="password" minlength="8" placeholder="Tối thiểu 8 ký tự" required>
                <div class="form-group">
                    <label for="dob">Ngày sinh</label>
                    <input type="date" id="dob" name="dob">
                </div>
            </div>
            </fieldset>
            <div class="form-group">
            <fieldset>  
                <legend>Hồ sơ chi tiết</legend>
                <div class="form-group">
                    <label>Giới tính:</label>
                    <input type="radio" id="male" name="gender" value="male" checked>
                    <label for="male" class="inline-label">Nam</label>
                    
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female" class="inline-label">Nữ</label>
                </div>

                <div class="form-group">
                    <label>Sở thích (Hobbies):</label>
                    <input type="checkbox" id="hobby1" name="hobbies" value="coding" checked>
                    <label for="hobby1" class="inline-label">Lập trình</label>
                    
                    <input type="checkbox" id="hobby2" name="hobbies" value="gaming">
                    <label for="hobby2" class="inline-label">Chơi game</label>
                    
                    <input type="checkbox" id="hobby3" name="hobbies" value="sports">
                    <label for="hobby3" class="inline-label">Thể thao</label>
                </div>

                <div class="form-group">    
                    <label for="city">Thành phố sinh sống:</label>
                    <select id="city" name="city">
                        <option value="">-- Vui lòng chọn --</option>
                        <option value="hn">Hà Nội</option>
                        <option value="dn">Đà Nẵng</option>
                        <option value="hcm">TP. Hồ Chí Minh</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="avatar">Tải ảnh đại diện (Avatar):</label>
                    <input type="file" id="avatar" name="avatar" accept="image/*">
                </div>
            </fieldset>
            </div>
            <div class="form-group">
                <label for="bio">Giới thiệu ngắn về bản thân:</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Bạn có thể viết vài dòng giới thiệu tại đây..."></textarea>
            </div>

            <div class="form-group" style="text-align: center; margin-top: 20px;">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms" class="inline-label">Tôi đã đọc và đồng ý với các <b>Điều khoản dịch vụ</b> <span style="color:red;">*</span></label>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">Hoàn Tất Đăng Ký</button>
                <button type="reset" class="btn-reset">Nhập Lại Từ Đầu</button>
            </div>
            
        </form>
    </div>
</body>
</html>
