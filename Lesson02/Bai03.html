<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 3: Lịch Học</title>
</head>
<body>

    <h3>Bài tập 3 : Tạo bảng sau bằng HTML</h3>

    <!-- Đưa toàn bộ style gộp viền, căn giữa và khoảng cách ô (cellpadding) trực tiếp vào thẻ table -->
    <table border="1" cellpadding="10" style="border-collapse: collapse; text-align: center; width: 800px; font-family: Arial, sans-serif;">
        
        <!-- PHẦN ĐẦU BẢNG -->
        <thead>
            <tr>
                <th rowspan="3">Buổi</th>
                <th colspan="3">Lịch học</th>
            </tr>
            <tr>
                <!-- Thêm màu nền xám trực tiếp vào style -->
                <th colspan="2" style="background-color: #c0c0c0;">Thời gian</th>
                <th rowspan="2" style="background-color: #c0c0c0;">Môn học</th>
            </tr>
            <tr>
                <th>Bắt đầu</th>
                <th>Kết thúc</th>
            </tr>
        </thead>

        <!-- PHẦN THÂN BẢNG -->
        <tbody>
            <!-- === Nhóm Thứ 2 === -->
            <tr>
                <td rowspan="2" style="font-weight: bold; background-color: #c0c0c0;">Thứ 2</td>
                <td rowspan="2" style="background-color: #c0c0c0;">8:00 AM</td>
                <td rowspan="2" style="background-color: #c0c0c0;">12:00 AM</td>
                <td style="background-color: #c0c0c0;">Cơ sở dữ liệu</td>
            </tr>
            <tr>
                <td>Nhập môn C</td>
            </tr>

            <!-- === Nhóm Thứ 3 === -->
            <tr>
                <td rowspan="3" style="font-weight: bold; background-color: #c0c0c0;">Thứ 3</td>
                <td style="background-color: #c0c0c0;">8:00 AM</td>
                <td style="background-color: #c0c0c0;">12:00 AM</td>
                <td rowspan="2" style="background-color: #c0c0c0;">Thiết kế web</td>
            </tr>
            <tr>
                <td>2:00 PM</td>
                <td>5:00 PM</td>
            </tr>
            <tr>
                <td style="background-color: #c0c0c0;">6:00 PM</td>
                <td style="background-color: #c0c0c0;">8:00 PM</td>
                <td style="background-color: #c0c0c0;">PHP</td>
            </tr>

            <!-- === Nhóm Thứ 4 === -->
            <tr>
                <!-- Chỉ cần in đậm, không có màu xám -->
                <td style="font-weight: bold;">Thứ 4</td>
                <td>2:00 PM</td>
                <td>9:00 PM</td>
                <td>JAVA CORE</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
