<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh viên</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="card left-panel">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="openAddForm()"> Thêm mới sinh viên</button>
                <div class="search-sort">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm sinh viên...">
                    <button class="btn btn-secondary" onclick="searchStudent()">Tìm</button>
                    <select id="sortSelect" class="form-select" onchange="sortStudent()">
                        <option value="">Sắp xếp...</option>
                        <option value="nameASC">Tên (A-Z)</option>
                        <option value="nameDESC">Tên (Z-A)</option>
                    </select>
                </div>
            </div>
            
            <h3>Danh Sách Sinh Viên</h3>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Mã SV</th>
                            <th>Tên sinh viên</th>
                            <th>Tuổi</th>
                            <th>Giới tính</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card right-panel" id="formPanel" style="display: none;">
            <h3>Thông Tin Chi Tiết</h3>
            <form id="studentForm">
                <div class="form-group">
                    <label>Mã sinh viên <span class="text-danger">*</span></label>
                    <input type="text" id="studentId" required placeholder="VD: SV001">
                </div>
                <div class="form-group">
                    <label>Tên sinh viên <span class="text-danger">*</span></label>
                    <input type="text" id="studentName" required placeholder="Nhập họ và tên">
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Tuổi <span class="text-danger">*</span></label>
                        <input type="number" id="age" required min="1" placeholder="Tuổi">
                    </div>
                    <div class="form-group half">
                        <label>Giới tính</label>
                        <select id="sex">
                            <option value="true">Nam</option>
                            <option value="false">Nữ</option>
                            <option value="null">Khác</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ngày sinh <span class="text-danger">*</span></label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="form-group">
                    <label>Nơi sinh</label>
                    <input type="text" id="birthPlace" placeholder="Nhập nơi sinh">
                </div>
                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input type="text" id="address" placeholder="Nhập địa chỉ hiện tại">
                </div>
                
                <div class="form-actions">
                    <!-- <button type="button" class="btn btn-secondary w-100" onclick="closeForm()">Hủy</button> -->
                    <button type="button" class="btn btn-primary w-100" id="btnSave" onclick="saveStudent()">Save</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
