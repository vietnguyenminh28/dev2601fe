<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab06-ex2</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Times New Roman", Times, serif;
        }

        .calculator-box {
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 30px 40px;
            width: 350px;
            text-align: center;
        }

        .calculator-box h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #4CAF50;
            border-radius: 25px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .button-group button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 18%;
        }

        .button-group button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="calculator-box">
        <h2>Thực hiện các phép<br>tính toán</h2>
        
        <div class="input-group">
            <input type="number" id="numA" placeholder="Nhập số a:">
        </div>
        
        <div class="input-group">
            <input type="number" id="numB" placeholder="Nhập số b:">
        </div>
        
        <div class="button-group">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">-</button>
            <button onclick="calculate('*')">*</button>
            <button onclick="calculate('/')">/</button>
            <button onclick="calculate('%')">%</button>
        </div>
        
        <div class="input-group">
            <input type="text" id="result" placeholder="Kết quả:" readonly>
        </div>
    </div>

    <script>
        function calculate(operator) {
            let a = parseFloat(document.getElementById("numA").value);
            let b = parseFloat(document.getElementById("numB").value);
            let resultInput = document.getElementById("result");

            if (isNaN(a) || isNaN(b)) {
                resultInput.value = "Vui lòng nhập số!";
                return;
            }

            let res = 0;
            switch (operator) {
                case '+':
                    res = a + b;
                    break;
                case '-':
                    res = a - b;
                    break;
                case '*':
                    res = a * b;
                    break;
                case '/':
                    res = (b !== 0) ? (a / b) : "Lỗi chia 0";
                    break;
                case '%':
                    res = (b !== 0) ? (a % b) : "Lỗi chia 0";
                    break;
            }

            resultInput.value = res;
        }
    </script>

</body>
</html>
