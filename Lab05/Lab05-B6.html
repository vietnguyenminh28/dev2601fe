<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lab06-ex6.html</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }
        #diamond-container {
            display: inline-block;
            text-align: center;
            line-height: 1.5;
            border: 2px solid #4CAF50;
            border-radius: 15px;
            padding: 20px 40px;
        }
    </style>
</head>
<body>

    <div id="diamond-container"></div>

    <script>
        let result = "";

        for (let i = 9; i >= 0; i--) {
            let row = "";
            for (let j = 0; j <= i; j++) {
                row += j + " ";
            }
            for (let j = i - 1; j >= 0; j--) {
                row += j + " ";
            }
            result += row.trim() + "<br>";
        }

        for (let i = 0; i <= 9; i++) {
            let row = "";
            for (let j = 0; j <= i; j++) {
                row += j + " ";
            }
            for (let j = i - 1; j >= 0; j--) {
                row += j + " ";
            }
            result += row.trim() + "<br>";
        }

        document.getElementById("diamond-container").innerHTML = result;
    </script>

</body>
</html>
