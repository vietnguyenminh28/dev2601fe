<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        #products{
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            /* grid-template-rows: 300px 1fr 3fr; */
            gap: 1rem;
        }
        .item{
            background-color: greenyellow;
            padding:1rem;
            border-radius: 0.5rem;
            text-align: center;
            color: red;

        }
    </style>
</head>
<body>
    <h1>Grid Layout</h1>
    <hr>
    <div id="products">
        <div class="item">Sp1</div>
        <div class="item">Sp2</div>
        <div class="item">Sp3</div>
        <div class="item">Sp4</div>
        <div class="item">Sp5</div>
        <div class="item">Sp6</div>
    </div>
</body>
</html>
