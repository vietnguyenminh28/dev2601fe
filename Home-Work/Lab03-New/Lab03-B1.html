<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lab03-ex1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        .box {
            width: 150px;
            height: 40px;
            border: 1px solid #000;
            margin-bottom: 15px;
            line-height: 40px;
            padding-left: 10px;
            box-sizing: border-box;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .box:hover {
            opacity: 0.7;
            transform: scale(1.05);
        }
        .red { background-color: red; }
        .green { background-color: green; }
        .blue { background-color: blue; }
        .yellow { background-color: yellow; }
    </style>
</head>
<body>
    <div class="box red">div-1</div>
    <div class="box green">div-2</div>
    <div class="box blue">div-3</div>
    <div class="box yellow">div-4</div>
</body>
</html>
