<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 2</title>
    <style>
        .container-bt2 {
            background-color: #e8e8ff;
            width: 500px;
            padding: 20px 30px;
            font-family: 'Times New Roman', serif;
        }

        .red {
            color: red;
        }

        .container-bt2 h5 {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .blue {
            color: navy;
            font-weight: bold;
        }

        .container-bt2 p {
            font-size: 16px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container-bt2">
        <h5 class="red">This is an H5 element that uses the RED class</h5>
        <h5>This is an H5 element that has been allowed to use hotpink style.</h5>
        <p class="blue">This paragraph uses the class BLUE</p>
        <p>This paragraph does not use the class BLUE</p>
        <p style="color: hotpink;">This paragraph is hotpink</p>
    </div>

</body>
</html>
